<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>СтопДЕП</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="icons/icon128.png" alt="" />
      <div><strong>СтопДЕП</strong><small>Фильтр рекламы</small></div>
      <div id="language" role="group" aria-label="Язык интерфейса">
        <button type="button" lang="ru" data-language="ru" aria-pressed="true">RU</button
        ><button type="button" lang="en" data-language="en" aria-pressed="false">
          EN
        </button>
      </div>
      <label class="master"
        ><input id="enabled" type="checkbox" aria-label="Включить СтопДЕП" role="switch"
      /></label>
    </header>
    <nav aria-label="Разделы">
      <button data-tab="filters" aria-pressed="true">Фильтры</button
      ><button data-tab="regions" aria-pressed="false">Области</button
      ><button data-tab="settings" aria-pressed="false">Настройки</button
      ><button data-tab="changes" aria-pressed="false">Изменения</button>
    </nav>
    <p id="savedMoney" class="money-total"></p>
    <main>
      <section id="filters">
        <label class="row"
          >Букмекеры, включая Winline<input type="checkbox" id="bet" role="switch"
        /></label>
        <label class="row"
          >Казино и азартные сайты<input type="checkbox" id="gambling" role="switch"
        /></label>
        <label class="row"
          >Кейсы и скин-гэмблинг<input type="checkbox" id="cases" role="switch"
        /></label>
        <label class="row"
          >Баннеры и ссылки стримеров<input type="checkbox" id="banners" role="switch"
        /></label>
      </section>
      <section id="regions" hidden>
        <div class="modes">
          <label><input type="radio" name="mode" value="solid" /> Закрасить</label
          ><label><input type="radio" name="mode" value="blur" checked /> Размытие</label
          ><label><input type="radio" name="mode" value="image" /> Моя картинка</label>
        </div>
        <label id="colorRow" class="row" hidden
          >Цвет заливки<input id="coverColor" type="color" value="#151515"
        /></label>
        <label id="strengthRow"
          >Сила размытия <output id="strengthValue">48</output
          ><input id="strength" type="range" min="4" max="140" value="48"
        /></label>
        <label id="fileRow" hidden
          >Картинка до 600 КБ<input
            id="file"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif"
        /></label>
        <button id="pick" class="primary">Выделить на фото или видео</button>
        <button id="pickPage" class="secondary">Выделить на странице</button>
        <button id="browseImages" class="secondary">Загруженные изображения</button>
        <div id="imageCatalog" hidden>
          <div class="catalog-header">
            <button id="closeCatalog" type="button">Скрыть предпросмотр</button>
          </div>
          <label
            >Файл<select
              id="imageAssets"
              size="6"
              aria-label="Загруженные изображения"
            ></select
          ></label>
          <div id="imageStage">
            <img id="assetPreview" hidden draggable="false" alt="Предпросмотр" /><video
              id="assetVideo"
              preload="metadata"
              muted
              hidden
            ></video>
            <div id="savedAssetAreas" aria-hidden="true"></div>
            <span id="assetSelection" hidden></span>
          </div>
          <button id="stepVideo" hidden>Следующий кадр</button
          ><button id="saveAsset" class="secondary" disabled>
            Сохранить выделение на изображении
          </button>
        </div>
        <button id="clearPageMasks" class="secondary">Убрать маски этого сайта</button
        ><button id="undoClearMasks" class="secondary" hidden>
          Вернуть удалённые маски
        </button>
        <input
          id="maskSearch"
          type="search"
          placeholder="Поиск по сайту, файлу или дате"
        /><button id="undoLast" class="secondary">Отменить последнее действие</button>
        <div class="folder-tools">
          <form id="newFolderForm">
            <input
              id="newFolderName"
              maxlength="80"
              placeholder="Название папки"
              aria-label="Название папки"
            /><button type="submit">Добавить папку</button>
          </form>
          <label
            >Папка<select id="folderFilter">
              <option value="*">Все области</option>
            </select></label
          >
          <form id="folderEditForm" hidden>
            <input id="folderRename" maxlength="80" aria-label="Название папки" /><button
              type="submit"
            >
              Переименовать</button
            ><button id="removeFolder" type="button">Удалить папку</button>
          </form>
        </div>
        <div class="bulk-tools">
          <div>
            <button id="selectAllMasks" type="button">Выбрать все / снять</button
            ><small id="selectionCount" aria-live="polite"></small>
          </div>
          <select id="bulkMove" aria-label="Переместить выбранные" disabled></select>
        </div>
        <ul id="saved" aria-label="Сохранённые области"></ul>
        <div id="editorHome">
          <form id="editActions" hidden>
            <label class="row"
              >Режим<select id="editMode">
                <option value="blur">Размытие</option>
                <option value="image">Моя картинка</option>
                <option value="solid">Закрасить</option>
              </select></label
            ><label id="editStrengthRow"
              >Сила размытия <output id="editStrengthValue"></output
              ><input id="editStrength" type="range" min="4" max="140" /></label
            ><label id="editColorRow" class="row" hidden
              >Цвет заливки<input id="editColor" type="color" /></label
            ><label id="editFileRow" hidden
              >Картинка до 600 КБ<input
                id="editFile"
                type="file"
                accept="image/png,image/jpeg,image/webp,image/gif"
            /></label>
            <div class="edit-buttons">
              <button id="saveEdit" class="primary" type="submit">
                Сохранить изменения</button
              ><button id="cancelEdit" type="button">Отмена</button>
            </div>
          </form>
        </div>
      </section>
      <section id="settings" hidden>
        <label>Замены</label>
        <div id="wordRows"></div>
        <label
          >Предпросмотр замен<input
            id="replacementSample"
            type="text"
            placeholder="Введи пример текста" /></label
        ><output id="replacementResult"></output
        ><button id="addWord" class="secondary">Добавить замену</button
        ><label class="site-title">Дополнительные сайты</label>
        <div id="siteRows"></div>
        <button id="addSite" class="secondary">Добавить сайт</button
        ><button id="saveWords" class="secondary">Сохранить замены</button
        ><label class="row"
          >Обрабатывать страницы Twitch<input
            id="twitchProcessing"
            type="checkbox"
            role="switch" /></label
        ><label class="row"
          >Задержка исчезновения, мс<input
            id="lingerMs"
            type="number"
            min="0"
            max="10000"
            step="1"
            value="0"
            aria-describedby="lingerHelp" /></label
        ><small id="lingerHelp"
          >0 — убрать размытие сразу после исчезновения фото или видео.</small
        ><button id="exportSettings" class="secondary">Экспорт настроек и областей</button
        ><button id="importSettings" class="secondary">Импорт из JSON</button
        ><input
          id="backupFile"
          type="file"
          accept=".json,application/json"
          hidden
        /><button id="diagnose" class="secondary">Диагностика конфликтов</button>
        <pre id="diagnosticResult"></pre>
        <div id="pictureSettings">
          <label id="pictureLabel">При блокировке</label
          ><select id="blockPicture" hidden>
            <option value="cats">Котики</option>
            <option value="dogs">Собачки</option>
            <option value="hamsters">Хомяки</option>
            <option value="custom">Свой вариант</option></select
          ><button
            id="pictureSelectButton"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            aria-labelledby="pictureLabel pictureSelected"
          >
            <span id="pictureSelected">Котики</span><span aria-hidden="true">⌄</span>
          </button>
          <div id="pictureOptions" hidden>
            <button type="button" data-picture="cats">Котики</button
            ><button type="button" data-picture="dogs">Собачки</button
            ><button type="button" data-picture="hamsters">Хомяки</button
            ><button type="button" data-picture="custom">Свой вариант</button>
          </div>
          <div id="blockPictureCustom" hidden>
            <label for="blockPictureQuery">Запрос Pinterest</label>
            <div class="custom-row">
              <input
                id="blockPictureQuery"
                type="text"
                maxlength="150"
                placeholder="Например, капибары"
              />
            </div>
          </div>
        </div>
      </section>
      <section id="changes" hidden><ul id="releaseList"></ul></section>
      <p id="status" role="status" hidden></p>
    </main>
    <script src="locale.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
